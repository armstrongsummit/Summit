<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <title>Summit Especialidades 2026</title>

  <style>
    :root{
      --text:#ffffff;
      --orange:#ff7a00;
      --orange-glow: rgba(255,122,0,.28);
      --blue:#00b9ff;
      --blue-glow: rgba(0,185,255,.26);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      background:
        linear-gradient(rgba(3,7,14,.18), rgba(3,7,14,.52)),
        url("bg.jpg") center center / cover no-repeat;
      overflow-x:hidden;
    }

    .page{
      position:relative;
      min-height:100vh;
      min-height:100dvh;
      padding:
        max(18px, env(safe-area-inset-top))
        22px
        max(24px, env(safe-area-inset-bottom));
      isolation:isolate;
    }

    .color-layer{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.88;
      mix-blend-mode:screen;
      pointer-events:none;
      z-index:-2;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at center, rgba(0,0,0,.04), rgba(0,0,0,.32)),
        linear-gradient(rgba(5,11,19,.08), rgba(5,11,19,.22));
      z-index:-1;
      pointer-events:none;
    }

    .layout{
      width:min(100%, 1080px);
      min-height:calc(100vh - max(18px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      min-height:calc(100dvh - max(18px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      margin:0 auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
      align-items:center;
    }

    .top{
      display:flex;
      justify-content:center;
      padding-top:14px;
    }

    .logo-armstrong{
      width:min(350px, 40vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.28));
    }

    .middle{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:34px;
      padding:18px 0 28px;
    }

    .farma-title{
      width:min(480px, 68vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.30));
    }

    .buttons{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:22px;
      flex-wrap:wrap;
      width:100%;
    }

    .btn{
      min-width:188px;
      min-height:54px;
      padding:14px 28px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      text-transform:uppercase;
      font-weight:800;
      letter-spacing:.03em;
      font-size:16px;
      color:#fff;
      background:rgba(16,22,32,.18);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn:active{
      transform:scale(.98);
    }

    .btn:focus-visible{
      outline:3px solid rgba(255,255,255,.88);
      outline-offset:3px;
    }

    .btn-agenda{
      border:1.6px solid var(--orange);
      box-shadow:0 0 0 1px rgba(255,122,0,.10) inset, 0 0 18px var(--orange-glow);
    }

    .btn-tour{
      border:1.6px solid var(--blue);
      box-shadow:0 0 0 1px rgba(0,185,255,.10) inset, 0 0 18px var(--blue-glow);
    }

    .bottom{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:18px;
      padding-bottom:10px;
    }

    .logo-summit{
      width:min(370px, 40vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.34));
    }

    .logo-specialties{
      width:min(470px, 52vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.30));
    }

    /* Tablet */
    @media (max-width: 900px){
      .logo-armstrong{ width:min(300px, 48vw); }
      .farma-title{ width:min(420px, 74vw); }
      .logo-summit{ width:min(320px, 64vw); }
      .logo-specialties{ width:min(410px, 78vw); }
    }

    /* Mobile */
    @media (max-width: 640px){
      .page{
        padding-left:18px;
        padding-right:18px;
      }

      .layout{
        grid-template-rows:auto 1fr auto;
      }

      .top{
        padding-top:6px;
      }

      .logo-armstrong{
        width:min(250px, 66vw);
      }

      .middle{
        gap:28px;
        padding:10px 0 18px;
      }

      .farma-title{
        width:min(320px, 84vw);
      }

      .buttons{
        flex-direction:column;
        gap:14px;
      }

      .btn{
        width:min(100%, 270px);
        min-width:0;
        min-height:52px;
      }

      .bottom{
        gap:16px;
        padding-bottom:4px;
      }

      .logo-summit{
        width:min(290px, 80vw);
      }

      .logo-specialties{
        width:min(310px, 88vw);
      }
    }

    @media (max-width: 390px){
      .logo-armstrong{ width:min(225px, 70vw); }
      .farma-title{ width:min(300px, 88vw); }
      .logo-summit{ width:min(280px, 88vw); }
      .logo-specialties{ width:min(295px, 92vw); }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="color-layer" src="layer_colores.png" alt="" aria-hidden="true">
    <div class="overlay" aria-hidden="true"></div>

    <section class="layout">
      <header class="top">
        <img class="logo-armstrong" src="logo_armstrong.png" alt="Armstrong">
      </header>

      <section class="middle">
        <img class="farma-title" src="farma.png" alt="2° Summit Farma B">

        <nav class="buttons" aria-label="Documentos del evento">
          <a class="btn btn-agenda" href="agenda.pdf" target="_blank" rel="noopener">Agenda</a>
          <a class="btn btn-tour" href="tour.pdf" target="_blank" rel="noopener">Tour</a>
        </nav>
      </section>

      <footer class="bottom">
        <img class="logo-summit" src="letras_summir.png" alt="Summit Especialidades">
        <img class="logo-specialties" src="logos_especialidades.png" alt="Especialidades del summit">
      </footer>
    </section>
  </main>
</body>
</html>
