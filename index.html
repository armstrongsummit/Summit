<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <title>Summit Especialidades 2026</title>

  <style>
    :root{
      --text:#ffffff;
      --orange:#ff7a00;
      --orange-soft:rgba(255,122,0,.22);
      --orange-glow:rgba(255,122,0,.25);

      --lime:#bfd200;
      --lime-soft:rgba(191,210,0,.22);
      --lime-glow:rgba(191,210,0,.20);

      --blue:#00b9ff;
      --blue-soft:rgba(0,185,255,.20);
      --blue-glow:rgba(0,185,255,.22);

      --pink:#d5007f;
      --pink-soft:rgba(213,0,127,.18);
      --pink-glow:rgba(213,0,127,.18);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      background:
        linear-gradient(rgba(4,9,18,.20), rgba(4,9,18,.54)),
        url("bg.jpg") center center / cover no-repeat;
      overflow-x:hidden;
    }

    .page{
      position:relative;
      min-height:100vh;
      min-height:100dvh;
      padding:
        max(18px, env(safe-area-inset-top))
        22px
        max(24px, env(safe-area-inset-bottom));
      isolation:isolate;
    }

    .layout{
      width:min(100%, 1080px);
      min-height:calc(100vh - max(18px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      min-height:calc(100dvh - max(18px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      margin:0 auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
      align-items:center;
    }

    .top{
      display:flex;
      justify-content:center;
      padding-top:8px;
    }

    .logo-armstrong{
      width:min(350px, 40vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.28));
    }

    .middle{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:26px;
      padding:12px 0 28px;
      transform:translateY(-28px);
    }

    .farma-title{
      width:min(480px, 68vw);
      max-width:100%;
      height:auto;
      margin:65px auto;
      display:block;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.30));
    }

    .button-area{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    .row{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:26px;
      flex-wrap:wrap;
    }

    .btn{
      min-width:220px;
      min-height:62px;
      padding:14px 26px;
      border-radius:12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      text-decoration:none;
      font-weight:800;
      line-height:1.05;
      font-size:17px;
      color:#fff;
      background:rgba(15,21,31,.18);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,.16);
    }

    .btn:hover{ transform:translateY(-2px); }
    .btn:active{ transform:scale(.98); }
    .btn:focus-visible{
      outline:3px solid rgba(255,255,255,.88);
      outline-offset:3px;
    }

    .btn-general{
      border:1.6px solid var(--lime);
      background: linear-gradient(180deg, var(--lime-soft), rgba(15,21,31,.20));
      box-shadow:0 0 0 1px rgba(191,210,0,.12) inset, 0 0 20px var(--lime-glow);
    }

    .btn-11{
      border:1.6px solid var(--orange);
      background: linear-gradient(180deg, var(--orange-soft), rgba(15,21,31,.20));
      box-shadow:0 0 0 1px rgba(255,122,0,.12) inset, 0 0 20px var(--orange-glow);
    }

    .btn-12{
      border:1.6px solid var(--blue);
      background: linear-gradient(180deg, var(--blue-soft), rgba(15,21,31,.20));
      box-shadow:0 0 0 1px rgba(0,185,255,.12) inset, 0 0 20px var(--blue-glow);
    }

    .btn-13{
      border:1.6px solid var(--pink);
      background: linear-gradient(180deg, var(--pink-soft), rgba(15,21,31,.20));
      box-shadow:0 0 0 1px rgba(213,0,127,.12) inset, 0 0 20px var(--pink-glow);
    }

    .bottom{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:18px;
      padding-bottom:10px;
      transform:translateY(-48px);
    }

    .logo-summit{
      width:min(370px, 40vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.34));
    }

    .logo-specialties{
      width:min(470px, 52vw);
      max-width:100%;
      height:auto;
      display:block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.30));
    }

    @media (max-width: 900px){
      .logo-armstrong{ width:min(300px, 48vw); }
      .farma-title{ width:min(420px, 74vw); }
      .logo-summit{ width:min(320px, 64vw); }
      .logo-specialties{ width:min(410px, 78vw); }
      .row{ gap:18px; }
      .btn{ min-width:200px; }
    }

    @media (max-width: 640px){
      .page{
        padding-left:18px;
        padding-right:18px;
      }

      .top{ padding-top:4px; }

      .logo-armstrong{
        width:min(248px, 66vw);
      }

      .middle{
        gap:22px;
        padding:10px 0 18px;
        transform:translateY(-52px);
      }

      .farma-title{
        width:min(320px, 84vw);
      }

      .button-area{
        gap:14px;
      }

      .row{
        flex-direction:column;
        gap:12px;
      }

      .btn{
        width:min(100%, 270px);
        min-width:0;
        min-height:54px;
        font-size:15px;
        padding:12px 18px;
      }

      .bottom{
        gap:16px;
        padding-bottom:4px;
        transform:translateY(-78px);
      }

      .logo-summit{
        width:min(290px, 86vw);
      }

      .logo-specialties{
        width:min(310px, 88vw);
      }
    }

    @media (max-width: 390px){
      .logo-armstrong{ width:min(225px, 70vw); }
      .farma-title{ width:min(300px, 88vw); }
      .logo-summit{ width:min(280px, 88vw); }
      .logo-specialties{ width:min(295px, 92vw); }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="layout">
      <header class="top">
        <img class="logo-armstrong" src="logo_armstrong.png" alt="Armstrong">
      </header>

      <section class="middle">
        <img class="farma-title" src="farma.png" alt="2° Summit Farma B">

        <div class="button-area" aria-label="Documentos del evento">
          <div class="row">
            <a class="btn btn-general" href="agenda.pdf" target="_blank" rel="noopener">Agenda General</a>
          </div>

          <div class="row">
            <a class="btn btn-11" href="agenda-11-octubre.pdf" target="_blank" rel="noopener">11 Octubre</a>
            <a class="btn btn-12" href="agenda-12-octubre.pdf" target="_blank" rel="noopener">12 Octubre</a>
            <a class="btn btn-13" href="tour.pdf" target="_blank" rel="noopener">13 Octubre:<br>Excursión</a>
          </div>
        </div>
      </section>

      <footer class="bottom">
        <img class="logo-summit" src="Letras_Summit.png" alt="Summit Especialidades">
        <img class="logo-specialties" src="logos_especialidades.png" alt="Especialidades del summit">
      </footer>
    </section>
  </main>
</body>
</html>
